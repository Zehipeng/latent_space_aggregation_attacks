[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "latent-space-aggregation-attacks"
version = "0.1.0"
description = "Protocol-locked diffusion watermark forgery and removal experiments"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "Pillow>=9.5",
  "PyYAML>=6",
  "scipy>=1.10",
  "pyarrow==15.0.2",
]

[project.optional-dependencies]
gpu = [
  "torch==2.1.2",
  "diffusers==0.30.3",
  "transformers==4.41.2",
  "accelerate==0.31.0",
  "huggingface-hub==0.23.4",
  "lpips==0.1.4",
  "torchvision==0.16.2",
  "pycryptodome==3.20.0",
  "scikit-image>=0.21",
  "matplotlib>=3.7",
]
test = ["pytest>=7.4"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
