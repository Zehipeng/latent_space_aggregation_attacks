protocol_version: formal_protocol_v1.18
master_seed: 205
run_mode: smoke
output_root: /root/autodl-tmp/outputs
formal_tasks: [forgery, removal]
key_count: 2
model_settings:
  - same_model_sd14_target_sd14_vae_proxy
  - cross_model_sd2_target_sd14_vae_proxy
watermarks: [tree_ring, ringid, gaussian_shading]
N_values: [1, 5, 25]
lambda_values: [10000.0, 20000.0, 50000.0]
beta_values: [1.0, 1.5, 2.0]
main_beta: 1.0
learning_rate: 0.02
T_forgery_formal: 150
T_removal_formal: 150
resume_every: 50
trajectory_every: 100
online_detection: false
early_stop: false
validated_batching:
  attack_batch_size: 1
  inversion_batch_size: 1
  reference_encode_batch_size: 1
  require_equivalence_gate: false
visualization_key_ids: [key_000, key_100, key_199]
reference_validity:
  selection_policy: first_accepted_from_preregistered_candidates
  candidate_limit: 64
  selected_count: 25
  require_all_selected_accepted: true
watermark_runtime:
  tree_ring:
    channel: 0
    radius: 16
    p_value_threshold: 0.05
    generation_steps: 50
    inversion_steps: 50
  ringid:
    radius: 14
    radius_cutoff: 3
    ring_value_range: 64
    p_value_threshold: 0.05
    generation_steps: 50
    inversion_steps: 50
  gaussian_shading:
    cipher: chacha20
    channel_copy: 1
    hw_copy: 8
    fpr: 0.000001
    bit_accuracy_threshold: 0.6484375
    generation_steps: 50
    inversion_steps: 50
removal_target_reference_index: 0
target_in_reference_aggregate: true
