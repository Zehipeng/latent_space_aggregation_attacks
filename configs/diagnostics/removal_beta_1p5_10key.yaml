protocol_version: formal_protocol_v1.14
master_seed: 205
run_mode: removal_diagnostic
key_count: 10
model_settings: [cross_model_sd2_target_sd14_vae_proxy]
watermarks: [tree_ring, ringid, gaussian_shading]
tasks: [removal]
methods: [proposed]
N_values: [5]
lambda_values: [10000.0]
beta_values: [1.5]
main_N: 5
main_lambda: 10000.0
main_beta: 1.5
learning_rate: 0.02
T_max: 3000
detection_every: 100
resume_every: 50
online_detection: false
early_stop: false
diagnostic_storage:
  persist_reference_images: false
  persist_final_images: true
  persist_checkpoint_images: false
diagnostic_metrics: [ASR, l2, linf, LPIPS, SSIM, PSNR, optimization_progress_pct]
reference_validity:
  selection_policy: first_accepted_from_preregistered_candidates
  candidate_limit: 64
  require_all_selected_accepted: true
watermark_runtime:
  tree_ring:
    channel: 0
    radius: 16
    p_value_threshold: 0.05
    generation_steps: 50
    inversion_steps: 50
  ringid:
    radius: 14
    radius_cutoff: 3
    ring_value_range: 64
    p_value_threshold: 0.05
    generation_steps: 50
    inversion_steps: 50
  gaussian_shading:
    cipher: chacha20
    channel_copy: 1
    hw_copy: 8
    fpr: 0.000001
    bit_accuracy_threshold: 0.6484375
    generation_steps: 50
    inversion_steps: 50
